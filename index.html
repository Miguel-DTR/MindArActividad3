<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      #aviso { position: fixed; top: 12px; left: 0; right: 0; text-align: center; z-index: 10; font-family: sans-serif; font-size: 18px; color: white; text-shadow: 0 0 4px black; pointer-events: none; }
      #boton { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; font-size: 18px; padding: 14px 24px; border: 0; border-radius: 12px; background: white; }
    </style>
  </head>
  <body>
    <div id="aviso">Apunta la cámara a un target</div>
    <button id="boton">Cambiar modelo</button>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 3" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <!-- Target 1 -->
        <a-asset-item id="modelo1a" src="./MODELOS/T1A/scene.gltf"></a-asset-item>
        <a-asset-item id="modelo1b" src="./T1B/scene.gltf"></a-asset-item>
        <!-- Target 2 -->
        <a-asset-item id="modelo2a" src="./T2A/scene.gltf"></a-asset-item>
        <a-asset-item id="modelo2b" src="./T2B/scene.gltf"></a-asset-item>
        <!-- Target 3 -->
        <a-asset-item id="modelo3a" src="./T3A/scene.gltf"></a-asset-item>
        <a-asset-item id="modelo3b" src="./T3B/scene.gltf"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model class="a" src="#modelo1a" position="0 0 0.1" rotation="0 0 0" scale="1 1 1" animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-gltf-model>
        <a-gltf-model class="b" src="#modelo1b" visible="false" position="0 0 0.1" rotation="0 0 0" scale="1 1 1" animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model class="a" src="#modelo2a" position="0 0 0.1" rotation="0 0 0" scale="1 1 1" animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-gltf-model>
        <a-gltf-model class="b" src="#modelo2b" visible="false" position="0 0 0.1" rotation="0 0 0" scale="1 1 1" animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model class="a" src="#modelo3a" position="0 0 0.1" rotation="0 0 0" scale="0.005 0.005 0.005" animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-gltf-model>
        <a-gltf-model class="b" src="#modelo3b" visible="false" position="0 0 0.1" rotation="0 0 0" scale="1 1 1" animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-gltf-model>
      </a-entity>
    </a-scene>

    <script>
      // El botón alterna entre el modelo A y el modelo B de todos los targets
      let mostrandoA = true;
      document.getElementById("boton").onclick = () => {
        mostrandoA = !mostrandoA;
        document.querySelectorAll(".a").forEach(m => m.setAttribute("visible", mostrandoA));
        document.querySelectorAll(".b").forEach(m => m.setAttribute("visible", !mostrandoA));
      };

      // Aviso visual: se oculta cuando se detecta un target
      const aviso = document.getElementById("aviso");
      document.querySelectorAll("[mindar-image-target]").forEach(t => {
        t.addEventListener("targetFound", () => aviso.style.display = "none");
        t.addEventListener("targetLost", () => aviso.style.display = "block");
      });
    </script>
  </body>
</html>
